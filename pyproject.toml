[project]
name = "oberon-fpl"
version = "0.1.0"
description = "Fantasy Premier League projection and squad optimisation. Recommends, never acts."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "structlog>=25.1.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
]

[project.scripts]
fpl = "fpl.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "respx>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fpl"]
